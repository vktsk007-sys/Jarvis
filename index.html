<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Voice Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(10, 14, 39, 0.95);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        h1 {
            color: #FFD700;
            font-size: 3em;
            text-shadow: 0 0 20px #FFD700;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #00d4ff;
            font-size: 0.9em;
            letter-spacing: 2px;
        }

        .status-box {
            background: #1a2a4a;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #status {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .api-section {
            background: #0a1a2a;
            border: 2px solid #FF6B6B;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .api-section label {
            color: #FF6B6B;
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .api-section input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #FF6B6B;
            color: #00ff00;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.85em;
            outline: none;
        }

        .api-section input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .input-section {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 2px solid #00d4ff;
            color: #00ff00;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1em;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        .mic-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            grid-column: 1;
        }

        .send-btn {
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            color: #000;
            grid-column: 2;
        }

        .stop-btn {
            background: linear-gradient(135deg, #a4b0bd, #8b95a5);
            color: white;
            grid-column: 1;
        }

        .clear-btn {
            background: linear-gradient(135deg, #95e1d3, #38a169);
            color: #000;
            grid-column: 2;
        }

        .transcript-box {
            background: #000;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        #transcript {
            color: #00ff00;
            font-family: monospace;
            line-height: 1.6;
            font-size: 0.95em;
            word-wrap: break-word;
        }

        .info-box {
            background: #0a1a2a;
            border: 1px solid #666;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85em;
            color: #aaa;
            text-align: center;
        }

        /* Scrollbar */
        .transcript-box::-webkit-scrollbar {
            width: 8px;
        }

        .transcript-box::-webkit-scrollbar-track {
            background: #000;
        }

        .transcript-box::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }

            button {
                padding: 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ JARVIS</h1>
            <div class="subtitle">AI VOICE ASSISTANT</div>
        </div>

        <div class="api-section">
            <label>🔑 Gemini API Key (Required):</label>
            <input 
                type="password" 
                id="apiKey" 
                placeholder="Paste your Gemini API key here..."
            >
            <small style="color: #999; margin-top: 5px; display: block;">
                Get free key: https://aistudio.google.com/app/apikeys
            </small>
        </div>

        <div class="status-box">
            <div id="status">🔧 System Initializing...</div>
        </div>

        <div class="input-section">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your command or use voice..."
                onkeypress="if(event.key === 'Enter') sendCommand()"
            >
        </div>

        <div class="button-group">
            <button class="mic-btn" onclick="startVoiceInput()">🎤 LISTEN</button>
            <button class="send-btn" onclick="sendCommand()">📤 SEND</button>
            <button class="stop-btn" onclick="stopVoice()">⏹️ STOP</button>
            <button class="clear-btn" onclick="clearAll()">🔄 CLEAR</button>
        </div>

        <div class="transcript-box">
            <div id="transcript">👾 Awaiting your command, Sir...</div>
        </div>

        <div class="info-box">
            ℹ️ Say something or type and press Enter / click Send
        </div>
    </div>

    <script>
        let recognition = null;
        let isListening = false;

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                updateStatus('❌ Speech Recognition not supported');
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                updateStatus('🎤 Listening...');
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript + ' ';
                }
                document.getElementById('userInput').value = transcript.trim();
            };

            recognition.onend = () => {
                isListening = false;
                updateStatus('✅ Ready');
            };

            recognition.onerror = (event) => {
                updateStatus(`❌ Error: ${event.error}`);
                isListening = false;
            };

            return true;
        }

        function updateStatus(message) {
            document.getElementById('status').innerText = message;
        }

        function updateTranscript(message) {
            document.getElementById('transcript').innerText = message;
        }

        function startVoiceInput() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                updateStatus('❌ Please enter API key first');
                return;
            }

            if (recognition && !isListening) {
                recognition.start();
            }
        }

        function stopVoice() {
            if (recognition && isListening) {
                recognition.stop();
            }
            window.speechSynthesis.cancel();
            updateStatus('⏹️ Stopped');
        }

        function clearAll() {
            document.getElementById('userInput').value = '';
            updateTranscript('👾 Awaiting your command, Sir...');
            updateStatus('✅ Ready');
            window.speechSynthesis.cancel();
        }

        async function sendCommand() {
            const userInput = document.getElementById('userInput').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();

            if (!userInput) {
                updateStatus('❌ Please type or say something');
                return;
            }

            if (!apiKey) {
                updateStatus('❌ API key is required');
                return;
            }

            updateStatus('⏳ Processing...');
            updateTranscript('Processing your command...');

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `You are JARVIS, the AI assistant from Iron Man. Be concise (1-2 sentences), loyal, respectful, and call the user 'Sir'. Respond to: ${userInput}`
                                }]
                            }]
                        })
                    }
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error('Invalid API response');
                }

                const aiReply = data.candidates[0].content.parts[0].text;
                updateTranscript(aiReply);
                updateStatus('✅ Response ready');

                // Speak the response
                speakResponse(aiReply);
                document.getElementById('userInput').value = '';

            } catch (error) {
                console.error('Error:', error);
                updateStatus(`❌ Error: ${error.message}`);
                updateTranscript(`Error: ${error.message}\n\nMake sure your API key is valid and has quota.`);
            }
        }

        function speakResponse(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.pitch = 0.8;
            utterance.rate = 1;
            utterance.volume = 1;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initSpeechRecognition();
            updateStatus('✅ System Ready');
        });

        // Handle Enter key
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendCommand();
            }
        });
    </script>
</body>
</html>
